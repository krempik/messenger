<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="E2E защищённый мессенджер by 4ayka Studio">
    <title>h4ck</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>
<body>
<div id="toast-container"></div>
<div id="connection-banner" class="connection-banner hidden"><span>&#9888; Переподключение...</span></div>

<div id="auth-screen">
    <div class="auth-container">
        <div class="auth-logo">
            <div class="shield">&#128128;</div>
            <h1>h4ck</h1>
            <div class="version-static">v2.2</div>
            <div class="subtitle">4ayka Studio</div>
            <p>E2E защищённый мессенджер</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Вход</button>
            <button class="auth-tab" data-tab="register">Регистрация</button>
        </div>
        <div class="server-url-section">
            <button type="button" id="server-toggle-btn" class="server-toggle-btn">&#9881; Сервер</button>
            <div id="server-settings-panel" class="server-settings-panel">
                <div class="form-group">
                    <label>URL сервера <span style="color:var(--text-muted);font-size:11px">(пусто = локальный)</span></label>
                    <input type="url" id="server-url-input" placeholder="https://your-tunnel.trycloudflare.com">
                </div>
            </div>
        </div>
        <form id="login-form" class="auth-form active">
            <div class="form-group"><label>Имя пользователя</label><input type="text" id="login-username" placeholder="username" autocomplete="username" required></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="login-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password" required></div>
            <div class="auth-error" id="login-error"></div>
            <button type="submit" class="btn-primary">Войти</button>
        </form>
        <form id="register-form" class="auth-form">
            <div class="form-group"><label>Имя пользователя</label><input type="text" id="reg-username" placeholder="username" autocomplete="username" required pattern="[a-zA-Z0-9_]{3,32}"></div>
            <div class="form-group"><label>Отображаемое имя</label><input type="text" id="reg-displayname" placeholder="Ваше имя" required maxlength="128"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="reg-password" placeholder="Минимум 6 символов" autocomplete="new-password" required minlength="6"></div>
            <div class="auth-error" id="reg-error"></div>
            <button type="submit" class="btn-primary">Создать аккаунт</button>
        </form>
        <a class="studio-link" href="https://krempik.github.io/4ayka-studio/index.html" target="_blank">4ayka Studio</a>
    </div>
</div>

<div id="app-screen" class="hidden">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-top">
                <div class="sidebar-brand"><h2>h4ck</h2><div class="version-static">v2.2</div></div>
                <div class="sidebar-actions"><button class="icon-btn" id="new-chat-btn" title="Новый чат">&#9998;</button></div>
            </div>
            <div class="search-box"><span class="search-icon">&#128269;</span><input type="text" id="search-input" placeholder="Поиск чатов..."></div>
        </div>
        <div class="chat-list" id="chat-list"></div>
        <div class="sidebar-footer">
            <div class="avatar-wrapper" id="my-avatar-wrapper">
                <div class="chat-avatar" id="my-avatar">?</div>
                <div class="avatar-edit-overlay" id="avatar-edit-btn">&#128247;</div>
                <input type="file" id="avatar-input" accept="image/*" style="display:none">
            </div>
            <div class="user-info"><div class="user-name" id="my-name">User</div><div class="user-status">&#9679; В сети</div></div>
            <button class="icon-btn" id="host-info-btn" title="Сервер">&#9741;</button>
            <button class="icon-btn" id="profile-btn" title="Профиль">&#128100;</button>
            <button class="icon-btn" id="theme-toggle-btn" title="Тема">&#9788;</button>
            <button class="btn-logout" id="logout-btn" title="Выйти">&#9211;</button>
        </div>
    </div>

    <div class="chat-area" id="chat-area">
        <div class="empty-state" id="empty-state">
            <div class="shield">&#128128;</div>
            <h3>h4ck</h3>
            <div class="sub">4ayka Studio</div>
            <p>Выберите чат или начните новый</p>
        </div>
        <div class="chat-view hidden" id="chat-view">
            <div class="chat-header">
                <button class="back-btn" id="back-btn">&larr;</button>
                <div class="chat-header-info" id="chat-header-clickable">
                    <div class="chat-avatar" id="chat-avatar">?</div>
                    <div class="chat-header-text">
                        <div class="chat-header-name" id="chat-header-name">Chat</div>
                        <div class="chat-header-status" id="chat-header-status">offline</div>
                    </div>
                </div>
                <div class="encryption-badge" id="encryption-badge">&#128274; E2E</div>
                <button class="icon-btn" id="search-chat-btn" title="Поиск">&#128269;</button>
                <button class="icon-btn" id="chat-menu-btn" title="Настройки">&#8942;</button>
            </div>
            <div class="chat-search-bar hidden" id="chat-search-bar">
                <input type="text" id="chat-search-input" placeholder="Поиск в чате...">
                <button class="icon-btn" id="chat-search-close">&times;</button>
            </div>
            <div class="messages-container" id="messages-container"></div>
            <div class="typing-indicator" id="typing-indicator"></div>
            <button class="scroll-bottom-btn hidden" id="scroll-bottom-btn">&#8595;</button>
            <div class="reply-preview hidden" id="reply-preview">
                <div class="reply-preview-content">
                    <span class="reply-preview-label">&#8617;</span>
                    <div class="reply-preview-texts">
                        <span class="reply-preview-author" id="reply-preview-author"></span>
                        <span class="reply-preview-text" id="reply-preview-text"></span>
                    </div>
                </div>
                <button class="icon-btn reply-close" id="reply-cancel-btn">&times;</button>
            </div>
            <div class="edit-preview hidden" id="edit-preview">
                <div class="edit-preview-content">
                    <span class="edit-preview-label">&#9998;</span>
                    <div class="edit-preview-texts">
                        <span class="edit-preview-title">Редактирование</span>
                        <span class="edit-preview-text" id="edit-preview-text"></span>
                    </div>
                </div>
                <button class="icon-btn edit-close" id="edit-cancel-btn">&times;</button>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <button class="icon-btn" id="attach-btn" title="Файл">&#128206;</button>
                    <button class="icon-btn" id="emoji-btn" title="Эмодзи">&#128578;</button>
                    <button class="icon-btn" id="sticker-btn" title="Стикеры">&#128172;</button>
                    <button class="icon-btn" id="gif-btn" title="GIF">&#127916;</button>
                    <input type="file" id="file-input" style="display:none">
                    <textarea id="message-input" rows="1" placeholder="Сообщение..."></textarea>
                    <button id="send-btn" title="Отправить">&#9654;</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal hidden" id="modal-new-chat">
        <div class="modal-header"><h3>Новый чат</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body">
            <div class="toggle-row">
                <label for="group-toggle-cb">Групповой чат</label>
                <label class="toggle-switch"><input type="checkbox" id="group-toggle-cb"><span class="toggle-slider"></span></label>
            </div>
            <div class="form-group hidden" id="group-name-group"><input type="text" id="group-name-input" placeholder="Название группы"></div>
            <div class="user-list" id="user-list"></div>
        </div>
        <div class="modal-footer"><button class="btn-cancel" data-close-modal>Отмена</button><button class="btn-primary" id="modal-create">Создать</button></div>
    </div>
    <div class="modal hidden" id="modal-profile">
        <div class="modal-header"><h3>Профиль</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body">
            <div class="profile-avatar-section">
                <div class="chat-avatar lg" id="profile-modal-avatar">?</div>
                <button type="button" id="profile-avatar-upload-btn" class="btn-text">Сменить аватар</button>
                <input type="file" id="profile-avatar-file-input" accept="image/*" style="display:none">
            </div>
            <div class="form-group"><label>Имя</label><input type="text" id="profile-displayname" maxlength="128"></div>
            <div class="form-group"><label>О себе</label><textarea id="profile-bio" rows="3" maxlength="512" placeholder="Расскажите о себе..."></textarea></div>
            <div class="form-group"><label>Новый пароль <span style="color:var(--text-muted);font-size:11px">(пусто = не менять)</span></label><input type="password" id="profile-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"></div>
            <div class="auth-error" id="profile-error"></div>
        </div>
        <div class="modal-footer"><button class="btn-cancel" data-close-modal>Отмена</button><button class="btn-primary" id="profile-save">Сохранить</button></div>
    </div>
    <div class="modal hidden" id="modal-user-profile">
        <div class="modal-header"><h3>Профиль</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body">
            <div class="profile-avatar-section"><div class="chat-avatar lg" id="user-profile-avatar">?</div></div>
            <div class="profile-info">
                <h3 id="user-profile-name"></h3>
                <div id="user-profile-username" class="text-muted"></div>
                <div id="user-profile-online" class="text-success"></div>
                <p id="user-profile-bio" class="text-muted" style="margin-top:12px"></p>
            </div>
        </div>
    </div>
    <div class="modal hidden" id="modal-host-info">
        <div class="modal-header"><h3>&#9741; Сервер</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body" id="host-info-content"><div class="spinner"></div></div>
        <div class="modal-footer"><button class="btn-cancel" data-close-modal>Закрыть</button></div>
    </div>
    <div class="modal hidden" id="modal-chat-menu">
        <div class="modal-header"><h3>Настройки чата</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body">
            <div class="form-group hidden" id="chat-avatar-group"><label>Аватар группы</label><button type="button" id="chat-avatar-upload-btn" class="btn-text">Сменить аватар</button><input type="file" id="chat-avatar-file-input" accept="image/*" style="display:none"></div>
            <div class="form-group hidden" id="chat-rename-group"><label>Название</label><input type="text" id="chat-rename-input" maxlength="128"><button class="btn-primary" id="chat-rename-btn">Сохранить</button></div>
            <div class="form-group hidden" id="chat-theme-group">
                <label>Цвет чата</label>
                <div class="theme-colors" id="theme-colors">
                    <button class="theme-color-btn" data-color="" style="background:var(--accent)">&#10005;</button>
                    <button class="theme-color-btn" data-color="#6c5ce7" style="background:#6c5ce7"></button>
                    <button class="theme-color-btn" data-color="#00b894" style="background:#00b894"></button>
                    <button class="theme-color-btn" data-color="#e17055" style="background:#e17055"></button>
                    <button class="theme-color-btn" data-color="#0984e3" style="background:#0984e3"></button>
                    <button class="theme-color-btn" data-color="#d63031" style="background:#d63031"></button>
                    <button class="theme-color-btn" data-color="#e84393" style="background:#e84393"></button>
                    <button class="theme-color-btn" data-color="#00cec9" style="background:#00cec9"></button>
                    <button class="theme-color-btn" data-color="#fdcb6e" style="background:#fdcb6e"></button>
                </div>
            </div>
            <div class="form-group hidden" id="chat-members-group">
                <label>Участники</label>
                <div class="members-list" id="members-list"></div>
                <button class="btn-text" id="add-member-btn">+ Добавить участника</button>
            </div>
            <button class="btn-danger hidden" id="chat-leave-btn">Покинуть чат</button>
            <button class="btn-danger" id="chat-delete-btn">Удалить чат</button>
        </div>
    </div>
    <div class="modal-lightbox hidden" id="modal-lightbox"><button class="lightbox-close" id="lightbox-close">&times;</button><img id="lightbox-img" src="" alt=""></div>
    <div class="modal hidden" id="modal-forward">
        <div class="modal-header"><h3>&#128228; Переслать</h3><button class="modal-close" data-close-modal>&times;</button></div>
        <div class="modal-body"><div class="forward-chat-list" id="forward-chat-list"></div></div>
    </div>
</div>

<div class="emoji-picker hidden" id="emoji-picker">
    <div class="emoji-picker-header">
        <input type="text" id="emoji-search" placeholder="Поиск эмодзи...">
    </div>
    <div class="emoji-picker-body" id="emoji-picker-body"></div>
</div>

<div class="gif-picker hidden" id="gif-picker">
    <div class="gif-picker-header">
        <input type="text" id="gif-search" placeholder="Поиск GIF...">
        <button class="icon-btn" id="gif-close">&times;</button>
    </div>
    <div class="gif-picker-body" id="gif-picker-body"></div>
</div>

<div class="sticker-picker hidden" id="sticker-picker">
    <div class="sticker-picker-header"><span>Стикеры</span><button class="icon-btn" id="sticker-close">&times;</button></div>
    <div class="sticker-picker-body" id="sticker-picker-body"></div>
</div>

<div class="context-menu hidden" id="context-menu">
    <button class="ctx-item" id="ctx-copy">&#128203; Копировать</button>
    <button class="ctx-item" id="ctx-reply">&#8617; Ответить</button>
    <button class="ctx-item" id="ctx-react">&#128077; Реакция</button>
    <button class="ctx-item" id="ctx-forward">&#128228; Переслать</button>
    <button class="ctx-item ctx-own" id="ctx-edit" style="display:none">&#9998; Изменить</button>
    <button class="ctx-item ctx-danger" id="ctx-delete">&#128465; Удалить</button>
</div>
<div class="reaction-picker hidden" id="reaction-picker">
    <button class="rp-item" data-emoji="&#128077;">&#128077;</button>
    <button class="rp-item" data-emoji="&#128078;">&#128078;</button>
    <button class="rp-item" data-emoji="&#10084;">&#10084;</button>
    <button class="rp-item" data-emoji="&#128514;">&#128514;</button>
    <button class="rp-item" data-emoji="&#128557;">&#128557;</button>
    <button class="rp-item" data-emoji="&#128064;">&#128064;</button>
    <button class="rp-item" data-emoji="&#128293;">&#128293;</button>
    <button class="rp-item" data-emoji="&#127881;">&#127881;</button>
</div>

<script src="/static/crypto.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
