<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | H4ck Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --green: #00ff41; --cyan: #00ffff; --red: #ff0040; --yellow: #ffff00; --bg: #0a0a0a; --card: #0d0d0d; --border: #1a1a1a; --text: #c0c0c0; --dim: #555; --font: 'Fira Code', monospace; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); }
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; position: relative; z-index: 2; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .logo { font-size: 1.3rem; color: var(--green); letter-spacing: 4px; text-shadow: 0 0 10px rgba(0,255,65,0.3); }
        .back { color: var(--dim); text-decoration: none; font-size: 0.8rem; transition: color 0.3s; }
        .back:hover { color: var(--green); }
        h1 { color: var(--green); font-size: 1.5rem; margin-bottom: 0.5rem; text-shadow: 0 0 10px rgba(0,255,65,0.3); }
        .subtitle { color: var(--dim); font-size: 0.8rem; margin-bottom: 2rem; }

        .login-box {
            max-width: 400px;
            margin: 4rem auto;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2rem;
        }
        .login-box h2 { color: var(--green); margin-bottom: 1.5rem; font-size: 1.1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: var(--green); font-size: 0.8rem; margin-bottom: 0.3rem; }
        .form-group input, .form-group select {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); font-family: var(--font); font-size: 0.85rem;
            padding: 0.7rem; outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--green); }
        .btn {
            background: transparent; border: 1px solid var(--green); color: var(--green);
            font-family: var(--font); font-size: 0.85rem; padding: 0.7rem 1.5rem;
            cursor: pointer; transition: all 0.3s; width: 100%;
        }
        .btn:hover { background: rgba(0,255,65,0.1); }
        .btn.danger { border-color: var(--red); color: var(--red); }
        .btn.danger:hover { background: rgba(255,0,64,0.1); }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.2rem;
            text-align: center;
        }
        .stat-card .num { font-size: 1.8rem; color: var(--green); font-weight: 700; }
        .stat-card .label { font-size: 0.7rem; color: var(--dim); margin-top: 0.3rem; }

        /* TABS */
        .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .tab {
            padding: 0.8rem 1.5rem; background: transparent; border: none;
            color: var(--dim); font-family: var(--font); font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s; border-bottom: 2px solid transparent;
        }
        .tab.active { color: var(--green); border-bottom-color: var(--green); }
        .tab:hover { color: var(--text); }
        .panel { display: none; }
        .panel.active { display: block; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 0.7rem 1rem; text-align: left; font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--green); font-weight: 500; }
        td { color: var(--text); }
        tr:hover td { background: rgba(0,255,65,0.03); }
        .badge {
            display: inline-block; padding: 2px 8px; font-size: 0.65rem;
            border: 1px solid var(--border); color: var(--dim);
        }
        .badge.online { border-color: var(--green); color: var(--green); }

        .refresh-btn {
            background: transparent; border: 1px solid var(--border); color: var(--dim);
            font-family: var(--font); font-size: 0.75rem; padding: 5px 12px;
            cursor: pointer; transition: all 0.3s; margin-bottom: 1rem;
        }
        .refresh-btn:hover { border-color: var(--green); color: var(--green); }

        .hidden { display: none; }

        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header class="header">
            <span class="logo">H4CK ADMIN</span>
            <a href="index.html" class="back">&lt; back to messenger</a>
        </header>

        <!-- LOGIN -->
        <div id="login-screen">
            <div class="login-box">
                <h2>&gt; admin login</h2>
                <div class="form-group">
                    <label>&gt; username:</label>
                    <input type="text" id="login-user" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>&gt; password:</label>
                    <input type="password" id="login-pass" placeholder="***">
                </div>
                <button class="btn" onclick="doLogin()">&gt; authenticate</button>
                <p id="login-error" style="color:var(--red);font-size:0.75rem;margin-top:0.8rem;"></p>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="hidden">
            <h1>~/admin/dashboard</h1>
            <p class="subtitle">// управление H4ck Messenger</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="num" id="stat-users">-</div>
                    <div class="label">ПОЛЬЗОВАТЕЛЕЙ</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-chats">-</div>
                    <div class="label">ЧАТОВ</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-messages">-</div>
                    <div class="label">СООБЩЕНИЙ</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="stat-online">-</div>
                    <div class="label">ОНЛАЙН</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="users">Пользователи</button>
                <button class="tab" data-tab="chats">Чаты</button>
                <button class="tab" data-tab="logs">Логи</button>
            </div>

            <div class="panel active" id="panel-users">
                <button class="refresh-btn" onclick="loadUsers()">&gt; refresh</button>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Username</th><th>Bio</th><th>Создан</th><th>Статус</th></tr>
                    </thead>
                    <tbody id="users-table"></tbody>
                </table>
            </div>

            <div class="panel" id="panel-chats">
                <button class="refresh-btn" onclick="loadChats()">&gt; refresh</button>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Название</th><th>Тип</th><th>Участники</th><th>Создан</th></tr>
                    </thead>
                    <tbody id="chats-table"></tbody>
                </table>
            </div>

            <div class="panel" id="panel-logs">
                <button class="refresh-btn" onclick="loadLogs()">&gt; refresh</button>
                <div id="logs-output" style="background:var(--card);border:1px solid var(--border);padding:1rem;max-height:400px;overflow-y:auto;font-size:0.75rem;"></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        let token = localStorage.getItem('admin_token');

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            });
        });

        async function doLogin() {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const err = document.getElementById('login-error');
            try {
                const r = await fetch(API + '/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, password: pass})
                });
                if (!r.ok) { err.textContent = '> access denied'; return; }
                const data = await r.json();
                token = data.token || data.access_token;
                localStorage.setItem('admin_token', token);
                showDashboard();
            } catch(e) {
                err.textContent = '> connection failed';
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadStats();
            loadUsers();
        }

        async function apiFetch(path, opts={}) {
            const r = await fetch(API + path, {
                ...opts,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json',
                    ...(opts.headers||{})
                }
            });
            if (r.status === 401 || r.status === 403) {
                localStorage.removeItem('admin_token');
                location.reload();
            }
            return r;
        }

        async function loadStats() {
            try {
                const r = await apiFetch('/api/admin/stats');
                if (r.ok) {
                    const d = await r.json();
                    document.getElementById('stat-users').textContent = d.users || 0;
                    document.getElementById('stat-chats').textContent = d.chats || 0;
                    document.getElementById('stat-messages').textContent = d.messages || 0;
                    document.getElementById('stat-online').textContent = d.online || 0;
                }
            } catch(e) {}
        }

        async function loadUsers() {
            try {
                const r = await apiFetch('/api/admin/users');
                if (!r.ok) return;
                const users = await r.json();
                const tbody = document.getElementById('users-table');
                tbody.innerHTML = users.map(u => `<tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.bio || '-'}</td>
                    <td>${u.created_at ? new Date(u.created_at).toLocaleDateString('ru-RU') : '-'}</td>
                    <td><span class="badge">user</span></td>
                </tr>`).join('');
            } catch(e) {}
        }

        async function loadChats() {
            try {
                const r = await apiFetch('/api/admin/chats');
                if (!r.ok) return;
                const chats = await r.json();
                const tbody = document.getElementById('chats-table');
                tbody.innerHTML = chats.map(c => `<tr>
                    <td>${c.id}</td>
                    <td>${c.name || 'direct'}</td>
                    <td><span class="badge">${c.type || 'private'}</span></td>
                    <td>${c.member_count || '?'}</td>
                    <td>${c.created_at ? new Date(c.created_at).toLocaleDateString('ru-RU') : '-'}</td>
                </tr>`).join('');
            } catch(e) {}
        }

        async function loadLogs() {
            try {
                const r = await apiFetch('/api/admin/logs?limit=50');
                if (!r.ok) return;
                const logs = await r.json();
                const out = document.getElementById('logs-output');
                out.innerHTML = logs.map(l =>
                    `<div style="margin-bottom:0.3rem;"><span style="color:var(--dim)">${l.time || ''}</span> <span style="color:var(--green)">${l.action || ''}</span> <span>${l.detail || ''}</span></div>`
                ).join('');
            } catch(e) {}
        }

        // Auto-login if token exists
        if (token) showDashboard();

        // Enter key on login
        document.getElementById('login-pass').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
